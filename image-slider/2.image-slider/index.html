<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="image-slider.css" />
  </head>
  <body>
    <h1>Image Slider Example</h1>

    <section
      class="slider-container"
      aria-roledescription="carousel"
      aria-label="Image slider"
    >
      <div class="slide-viewport" aria-live="polite">
        <p class="status-message">Loading images...</p>
      </div>

      <div class="slider-controls">
        <button class="prev-button" type="button" aria-label="Previous image">
          Previous
        </button>

        <div
          class="dot-container"
          role="tablist"
          aria-label="Choose slide"
        ></div>

        <button class="next-button" type="button" aria-label="Next image">
          Next
        </button>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
