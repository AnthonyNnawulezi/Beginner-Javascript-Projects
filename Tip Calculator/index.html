<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Tip Calculator</h1>
    <section class="container">
      <div class="wrapper">
        <label for="bill-amount">Bill Amount (£)</label>
        <input
          type="number"
          id="bill-amount"
          min="0"
          step="0.01"
          placeholder="0.00"
        />
      </div>
      <div class="wrapper">
        <label for="discount-percentage">Discount (%)</label>
        <span id="discount-display">0</span>
        <input
          type="range"
          min="0"
          max="100"
          id="discount-percentage"
          value="0"
        />
      </div>
      <div class="wrapper">
        <label for="tip-percentage">Tip Percentage (%)</label>
        <span id="tip-display">0</span>
        <input type="range" min="0" max="100" value="0" id="tip-percentage" />
      </div>
      <div class="wrapper">
        <label for="customer-count">Number of Customers</label>
        <span id="customer-display">1</span>
        <input type="range" min="1" max="20" id="customer-count" value="1" />
      </div>

      <button id="generate-bill">Generate Bill</button>

      <div>Total Tip Paid: $<span id="total-tip">0.00</span></div>
      <div>Total Amount To Pay: $<span id="total-amount">0.00</span></div>
      <div>Each Customer To Pay: $<span id="each-customer-pay">0.00</span></div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
