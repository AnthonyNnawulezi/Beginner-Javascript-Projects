<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Custom Tabs</title>
  </head>
  <body>
    <h1>Custome Tabs</h1>
    <div class="container">
      <button class="tabs active" data-id="home">Home</button>
      <button class="tabs" data-id="services">Services</button>
      <button class="tabs" data-id="projects">Projects</button>
      <button class="tabs" data-id="portfolio">Portfolio</button>
      <button class="tabs" data-id="contact">Contact</button>
    </div>
    <div class="contents">
      <p class="content" id="home">Home</p>
      <p class="content" id="services">Services</p>
      <p class="content" id="projects">Projects</p>
      <p class="content" id="portfolio">Portfolio</p>
      <p class="content" id="contact">Contact</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
